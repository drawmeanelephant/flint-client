name: Bug report
description: Report a reproducible client problem without exposing private data.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the refusal/exit code, not secrets or private store contents.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal source, exact commands, platform, Zig version, and client commit.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options: ["P0 - data loss or urgent security", "P1 - core workflow blocked", "P2 - normal", "P3 - minor"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [cli, parser, store, signing, merge, sync, tooling, docs]
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Regression coverage and context
      description: Related issue/PR, affected tests, and redacted evidence.
