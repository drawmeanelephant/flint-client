name: Workflow review

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  review:
    # Static workflow review only; never execute PR scripts with a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate inline workflow review findings
        uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5 # v1
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_level: error
          github_token: ${{ secrets.GITHUB_TOKEN }}
